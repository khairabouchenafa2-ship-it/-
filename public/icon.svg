<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
  </defs>

  <!-- Rounded app background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#fef3c7" stroke-opacity="0.35" stroke-width="6" />

  <!-- Open Book Base -->
  <path d="M96 320 C96 292, 160 278, 256 306 C352 278, 416 292, 416 320 L416 408 C416 416, 408 422, 398 418 C340 398, 286 404, 256 422 C226 404, 172 398, 114 418 C104 422, 96 416, 96 408 Z" fill="#fffbeb" stroke="#78350f" stroke-width="10" stroke-linejoin="round" />
  <line x1="256" y1="306" x2="256" y2="420" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
  <!-- Book lines -->
  <path d="M132 336 Q184 324 228 338" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  <path d="M132 366 Q184 354 228 368" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" />
  <path d="M284 338 Q328 324 380 336" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  <path d="M284 368 Q328 354 380 366" fill="none" stroke="#fcd34d" stroke-width="8" stroke-linecap="round" />

  <!-- Cute Owl Mascot Head -->
  <circle cx="256" cy="222" r="88" fill="#92400e" stroke="#451a03" stroke-width="10" />
  <!-- Owl Ear Tufts -->
  <path d="M174 172 L156 126 L204 152 Z" fill="#92400e" stroke="#451a03" stroke-width="9" stroke-linejoin="round" />
  <path d="M338 172 L356 126 L308 152 Z" fill="#92400e" stroke="#451a03" stroke-width="9" stroke-linejoin="round" />
  <!-- Owl Face Mask -->
  <circle cx="220" cy="214" r="36" fill="#fef3c7" stroke="#78350f" stroke-width="6" />
  <circle cx="292" cy="214" r="36" fill="#fef3c7" stroke="#78350f" stroke-width="6" />
  <!-- Owl Eyes -->
  <circle cx="224" cy="214" r="16" fill="#1c1917" />
  <circle cx="288" cy="214" r="16" fill="#1c1917" />
  <circle cx="230" cy="208" r="6" fill="#ffffff" />
  <circle cx="294" cy="208" r="6" fill="#ffffff" />
  <!-- Owl Beak -->
  <path d="M240 238 L272 238 L256 266 Z" fill="#f59e0b" stroke="#451a03" stroke-width="6" stroke-linejoin="round" />

  <!-- Golden Grammar Crown (تاج الفاعل) -->
  <path d="M196 138 L210 82 L240 112 L256 68 L272 112 L302 82 L316 138 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="8" stroke-linejoin="round" />
  <circle cx="256" cy="64" r="9" fill="#fef08a" stroke="#78350f" stroke-width="5" />
  <circle cx="208" cy="78" r="7" fill="#fef08a" stroke="#78350f" stroke-width="5" />
  <circle cx="304" cy="78" r="7" fill="#fef08a" stroke="#78350f" stroke-width="5" />

  <!-- Sparkle stars -->
  <path d="M108 124 L116 144 L136 152 L116 160 L108 180 L100 160 L80 152 L100 144 Z" fill="#fef08a" />
  <path d="M404 124 L410 140 L426 146 L410 152 L404 168 L398 152 L382 146 L398 140 Z" fill="#fef08a" />
</svg>
